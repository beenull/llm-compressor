quant_stage:
  quant_modifiers:
    SpinQuantModifier:
      backe_mean: True
      rotations: ["R1", "R2", "R4"]
      transform_block_size_R1: 2048
      transform_block_size_R4: 256
      learnable: True
      transform_type: "random-hadamard"  #"random-hadamard" "hadamard"
      ignore: ["re:lm_head", "re:.*visual.*","re:.*medusa_head"]
      
