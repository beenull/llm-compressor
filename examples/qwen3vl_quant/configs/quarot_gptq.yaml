quant_stage:
  quant_modifiers:
    SpinQuantModifier:
      backe_mean: True
      learnable: False
      rotations: ["R1", "R2", "R4"]
      transform_block_size_R1: 1536   # hidden_size of Qwen3-VL 2B
      transform_block_size_R4: 256
      transform_type: "hadamard"  # "random-hadamard" or "hadamard"
    GPTQModifier:
      ignore: ["re:.*lm_head", "re:.*visual.*"]
      actorder: null
      config_groups:
        group_0:
          weights:
            observer: mse
            observer_kwargs:
              maxshrink: 0.1
              patience: 10
              averaging_constant: 0.05
              grid: 128.0
              norm: 2.0
            num_bits: 4
            type: int
            symmetric: true
            strategy: channel
          targets:
            - "re:.*q_proj$"
            - "re:.*k_proj$"
            - "re:.*v_proj$"
            - "re:.*o_proj$"
            - "re:.*up_proj$"
            - "re:.*gate_proj$"
            - "re:.*down_proj$"
