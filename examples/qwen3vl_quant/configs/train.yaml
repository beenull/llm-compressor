
seq_len: 2048
train_args:
    remove_unused_columns: False
    warmup_steps: 30
    dataloader_drop_last: True
    accelerator_config:
        dispatch_batches: False
    special:
        loss_type: kl_top
        opt_type: RAdam
        rotate_lr: 0.136
        rotate_momentum: 0.0
        smooth_lr: 0.01
        smooth_momentum: 0.9
    max_steps: 300
    save_strategy: 'no'
    seed: 42
    fp16: False
    bf16: True
    log_on_each_node: False
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 1
    logging_steps: 1
    learning_rate: 0.136
    weight_decay: 0.
    lr_scheduler_type: "cosine"
    fsdp: "full_shard"
    fsdp_config:
        transformer_layer_cls_to_wrap: "Qwen3VLTextDecoderLayer,TeacherModel"
